<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<title>Kakeibo Admin</title>
<style>
  :root{--bg:#ece3ce;--card:#fbf7ea;--ink:#2a251d;--mute:#7c8ba3;--line:#c8bd9c;--red:#ac3527;--navy:#17233d;--amber:#d9822f;--green:#2f7d4f}
  @media (prefers-color-scheme:dark){:root{--bg:#121a2e;--card:#1b2744;--ink:#f1ead8;--mute:#a9b4c8;--line:#33446b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--navy);color:#fff}
  header h1{font-size:17px;margin:0;flex:1}
  main{max-width:900px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  input,select,button{font:inherit;color:inherit}
  input,select{background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
  button{border:0;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--red);color:#fff}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.ok{background:var(--green)}
  button:disabled{opacity:.5;cursor:default}
  label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:140px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:22px}.stat span{font-size:11.5px;color:var(--mute)}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--line);color:var(--ink);margin-right:4px}
  .badge.premium{background:#3b6ea5;color:#fff}.badge.plus{background:var(--amber);color:#2a251d}
  .badge.warn{background:#f4d9a8;color:#7a4a00}.badge.pend{background:var(--red);color:#fff}
  .name{font-weight:700}.mail{color:var(--mute);font-size:12.5px;word-break:break-all}
  .item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}
  .meta{margin:4px 0 8px}
  .msg{padding:9px 12px;border-radius:10px;margin-bottom:10px;background:#f4d9d5;color:#7a1f14}
  .msg.good{background:#d6ecdc;color:#1c5a35}
  .empty{color:var(--mute);text-align:center;padding:20px}
  pre.json{white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;background:rgba(0,0,0,.06);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Consolas,monospace;margin:8px 0 0}
  .key{font:600 12.5px ui-monospace,Consolas,monospace;word-break:break-all}
  .chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding:6px 0;border-bottom:1px solid var(--line)}
  .chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:0}
  .chart i{display:block;background:var(--navy);border-radius:3px 3px 0 0;min-height:1px}.chart i.n{background:var(--amber);border-radius:0}
  .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
  .legend{font-size:12px;color:var(--mute);margin:6px 0 0}.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
  .bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar span{width:120px;flex:0 0 120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar em{flex:1;height:10px;border-radius:5px;background:rgba(0,0,0,.08);overflow:hidden;font-style:normal}.bar em i{display:block;height:100%;background:var(--red)}.bar b{width:36px;text-align:right}
  h3{font-size:14px;margin:4px 0 8px}.two{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .act{font-size:12px;color:var(--mute);margin-top:2px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
  .raw{white-space:pre-wrap;font-size:12.5px;background:rgba(0,0,0,.05);border-radius:9px;padding:8px;margin:6px 0;max-height:160px;overflow:auto}
  @media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Kakeibo Admin</h1><button class="ghost" id="out" style="display:none;color:#fff;border-color:#ffffff66">Keluar</button></header>
<main id="app"></main>
<script>
"use strict";
var KEY_STORE = "kk_admin_key", BASE_STORE = "kk_admin_base";
var S = { an: null, jobs: [], srcs: [], jobSt: "pending", sort: "created", base: localStorage.getItem(BASE_STORE) || "https://chat.iranza.com", key: sessionStorage.getItem(KEY_STORE) || "", tab: "dash", users: [], more: false, stats: null, reqs: [], q: "", f: "all", off: 0, mat: [], matPre: "", matView: null };
var LABEL = { free: "Gratis", premium: "Premium", plus: "Premium+" };
var LANGN = { id: "Indonesia", en: "English", my: "Myanmar", bn: "Bangla", vi: "Vietnam", th: "Thai", ja: "日本語", zh: "中文", ko: "한국어" };
function ago(ts) {
  if (!ts) return "belum pernah";
  var m = Math.floor((Date.now() - ts) / 6e4);
  if (m < 2) return "baru saja"; if (m < 60) return m + " menit lalu"; if (m < 1440) return Math.floor(m / 60) + " jam lalu";
  var d = Math.floor(m / 1440); return d < 60 ? d + " hari lalu" : fmtDate(ts);
}
function actColor(ts) { var d = ts ? (Date.now() - ts) / 864e5 : 999; return d <= 1 ? "var(--green)" : d <= 7 ? "var(--amber)" : d <= 30 ? "var(--mute)" : "var(--red)"; }
var $ = function (s) { return document.querySelector(s); };

function el(tag, props) {
  var e = document.createElement(tag), i, k, c;
  for (k in (props || {})) {
    if (k === "class") e.className = props[k];
    else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), props[k]);

  var add = function (c) { if (c == null || c === false) return; if (Array.isArray(c)) return c.forEach(add); e.append(c.nodeType ? c : document.createTextNode(String(c))); };
  for (i = 2; i < arguments.length; i++) add(arguments[i]);
  return e;
}
function fmtDate(ts) { return new Date(ts).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }); }
function fmtTime(ts) { return new Date(ts).toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
function daysLeft(ts) { return Math.ceil((ts - Date.now()) / 864e5); }

function flash(text, good) {
  var old = $("#flash"); if (old) old.remove();
  var m = el("div", { id: "flash", class: "msg" + (good ? " good" : "") }, text);
  var app = $("#app"); app.insertBefore(m, app.firstChild);
  setTimeout(function () { if (m.parentNode) m.remove(); }, 4500);
}

function call(path, method, body) {
  return fetch(S.base + path, { method: method || "GET", headers: { "x-admin-key": S.key, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" })
    .catch(function () { throw { msg: "Tidak bisa terhubung ke server. Cek alamat API dan ALLOWED_ORIGIN di worker." }; })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401) { logout(); throw { msg: "Admin key salah." }; }
        if (r.status === 429) throw { msg: "Terlalu banyak percobaan salah. Coba lagi sekitar 1 jam." };
        if (r.status === 404) throw { msg: "Endpoint admin tidak ditemukan. Pastikan worker versi terbaru sudah di-deploy dan ADMIN_KEY sudah diisi." };
        if (!r.ok) throw { msg: "Server error (" + r.status + ")." };
        return j;
      });
    });
}

function logout() { S.key = ""; sessionStorage.removeItem(KEY_STORE); draw(); }
function validBase(b) { return /^https:\/\/[^\s/]+$/.test(b) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(b); }

function drawLogin(err) {
  var app = $("#app"); app.textContent = ""; $("#out").style.display = "none";
  var base = el("input", { id: "base", class: "grow", value: S.base, autocomplete: "off", spellcheck: "false" });
  var key = el("input", { id: "key", type: "password", class: "grow", autocomplete: "off", placeholder: "ADMIN_KEY" });
  var go = el("button", { id: "go" }, "Masuk");
  function submit() {
    var b = base.value.trim().replace(/\/+$/, "");
    if (!validBase(b)) return flash("Alamat API harus https://... (atau http://localhost).");
    if (!key.value) return flash("Isi admin key.");
    S.base = b; S.key = key.value; localStorage.setItem(BASE_STORE, b);
    go.disabled = true;
    call("/api/admin/users?limit=1").then(function () { sessionStorage.setItem(KEY_STORE, S.key); S.tab = "dash"; refreshAll(); })
      .catch(function (e) { go.disabled = false; S.key = ""; drawLogin(e.msg); });
  }
  go.addEventListener("click", submit);
  key.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  app.append(
    el("div", { class: "card" },
      err ? el("div", { class: "msg" }, err) : null,
      el("label", null, "Alamat API (worker)"), el("div", { class: "row" }, base),
      el("label", null, "Admin key (disimpan hanya selama tab ini terbuka)"), el("div", { class: "row" }, key),
      el("div", { class: "row", style: "margin-top:14px" }, go))
  );
}

function badge(plan) { return el("span", { class: "badge " + plan }, LABEL[plan] || plan); }

function userRow(u) {
  var plan = el("select", null, el("option", { value: "premium" }, "Premium"), el("option", { value: "plus" }, "Premium+"), el("option", { value: "free" }, "Cabut (Gratis)"));
  plan.value = u.pending || (u.plan === "free" ? "premium" : u.plan);
  var dur = el("select", null, el("option", { value: "30" }, "30 hari"), el("option", { value: "90" }, "90 hari"), el("option", { value: "180" }, "180 hari"), el("option", { value: "365" }, "365 hari"), el("option", { value: "0" }, "Tanpa batas"));
  var apply = el("button", null, "Terapkan");
  apply.addEventListener("click", function () {
    var p = plan.value, d = parseInt(dur.value, 10), what = p === "free" ? "Cabut paket" : LABEL[p] + " " + (d ? d + " hari" : "tanpa batas");
    if (!confirm(what + " untuk " + u.email + "?")) return;
    apply.disabled = true;
    setPlan(u.id, p, d);
  });
  var info = el("div", { class: "meta" }, badge(u.plan));
  if (u.pending) info.append(el("span", { class: "badge pend" }, "Minta " + LABEL[u.pending]));
  if (u.plan !== "free") {
    info.append(u.until ? "sampai " + fmtDate(u.until) : "tanpa batas");
    if (u.until && daysLeft(u.until) <= 7) info.append(" ", el("span", { class: "badge warn" }, "habis " + Math.max(daysLeft(u.until), 0) + " hari lagi"));
  }
  var act = el("div", { class: "act" }, el("span", { class: "dot", style: "background:" + actColor(u.seen) }),
    "Aktif terakhir " + ago(u.seen) + (u.opens ? " · " + u.opens + "× buka app" : "") + (u.platform ? " · " + u.platform : "") +
    " · " + (LANGN[u.lang] || u.lang || "-") + (u.created ? " · daftar " + fmtDate(u.created) : "") + (u.ver ? " · v" + u.ver : ""));
  return el("div", { class: "item" },
    el("div", { class: "name" }, u.name || "(tanpa nama)"), el("div", { class: "mail" }, u.email), act, info,
    el("div", { class: "row" }, plan, dur, apply));
}

function reqRow(r) {
  var dur = el("select", null, el("option", { value: "30" }, "30 hari"), el("option", { value: "90" }, "90 hari"), el("option", { value: "180" }, "180 hari"), el("option", { value: "365" }, "365 hari"), el("option", { value: "0" }, "Tanpa batas"));
  var yes = el("button", { class: "ok" }, "Setujui " + LABEL[r.plan]), no = el("button", { class: "ghost" }, "Tolak");
  yes.addEventListener("click", function () {
    var d = parseInt(dur.value, 10);
    if (!confirm("Setujui " + LABEL[r.plan] + " " + (d ? d + " hari" : "tanpa batas") + " untuk " + r.user.email + "?")) return;
    yes.disabled = no.disabled = true; setPlan(r.user.id, r.plan, d);
  });
  no.addEventListener("click", function () {
    if (!confirm("Tolak permintaan " + r.user.email + "?")) return;
    yes.disabled = no.disabled = true;
    call("/api/admin/reject", "POST", { id: r.id }).then(function () { flash("Permintaan ditolak.", true); refreshAll(); }).catch(function (e) { yes.disabled = no.disabled = false; flash(e.msg); });
  });
  return el("div", { class: "item" },
    el("div", { class: "name" }, r.user.name || "(tanpa nama)"), el("div", { class: "mail" }, r.user.email),
    el("div", { class: "meta" }, el("span", { class: "badge pend" }, "Minta " + LABEL[r.plan]), "sekarang ", badge(r.user.plan), " · " + fmtTime(r.created)),
    el("div", { class: "row" }, dur, yes, no));
}

function setPlan(id, plan, days) {
  call("/api/admin/plan", "POST", { user_id: id, plan: plan, days: days })
    .then(function (j) { flash(j.ok ? "Paket diperbarui." : "Pengguna tidak ditemukan.", j.ok); refreshAll(); })
    .catch(function (e) { flash(e.msg); refreshAll(); });
}

function loadUsers(append) {
  if (!append) S.off = 0;
  var qs = "?limit=50&offset=" + S.off + "&plan=" + encodeURIComponent(S.f) + "&sort=" + S.sort + (S.q ? "&q=" + encodeURIComponent(S.q) : "");
  return call("/api/admin/users" + qs).then(function (j) {
    S.users = append ? S.users.concat(j.users) : j.users; S.more = j.more; S.stats = j.stats;
  });
}
function refreshAll() {
  Promise.all([loadUsers(false), call("/api/admin/requests").then(function (j) { S.reqs = j.requests; }), loadAn()])
    .then(draw).catch(function (e) { flash(e.msg); });
}

function loadAn() { return call("/api/admin/analytics?days=30").then(function (j) { S.an = j; }).catch(function () { S.an = null; }); }
function bars(title, rows, label) {
  var max = Math.max.apply(null, rows.map(function (r) { return r.n; }).concat([1]));
  return el("div", { class: "card" }, el("h3", null, title), rows.length ? null : el("div", { class: "empty" }, "-"),
    rows.map(function (r) { return el("div", { class: "bar" }, el("span", null, label(r)), el("em", null, el("i", { style: "width:" + Math.round(r.n / max * 100) + "%" })), el("b", null, r.n)); }));
}
function drawDash(app) {
  var a = S.an;
  if (!a) return app.append(el("div", { class: "card empty" }, "Statistik belum tersedia. Pastikan worker versi terbaru sudah di-deploy."));
  var T = a.totals, st = function (n, l) { return el("div", { class: "stat" }, el("b", null, n), el("span", null, l)); };
  app.append(el("div", { class: "stats" }, st(T.users, "Total pengguna"), st(T.dau, "Aktif hari ini"), st(T.wau, "Aktif 7 hari"), st(T.mau, "Aktif 30 hari")),
    el("div", { class: "stats" }, st(T.new1, "Baru 24 jam"), st(T.new7, "Baru 7 hari"), st(T.new30, "Baru 30 hari"), st(T.opens30, "Buka app (30 hari)")));
  var max = Math.max.apply(null, a.daily.map(function (d) { return Math.max(d.active, d.new); }).concat([1]));
  var chart = el("div", { class: "chart" }, a.daily.map(function (d) {
    return el("div", { title: d.day + " · aktif " + d.active + " · baru " + d.new + " · buka " + d.opens },
      el("i", { class: "n", style: "height:" + Math.round(d.new / max * 100) + "px" }), el("i", { style: "height:" + Math.round(d.active / max * 100) + "px" }));
  }));
  app.append(el("div", { class: "card" }, el("h3", null, "Pengguna aktif & baru per hari (30 hari, waktu Jepang)"), chart,
    el("div", { class: "axis" }, el("span", null, a.daily[0].day.slice(5)), el("span", null, a.daily[a.daily.length - 1].day.slice(5))),
    el("div", { class: "legend" }, el("b", { style: "background:var(--navy)" }), "Aktif", el("b", { style: "background:var(--amber)" }), "Baru daftar")));
  app.append(el("div", { class: "two" },
    bars("Bahasa", a.langs.map(function (r) { return { n: r.n, k: r.lang }; }), function (r) { return LANGN[r.k] || r.k; }),
    bars("Paket", a.plans.map(function (r) { return { n: r.n, k: r.p }; }), function (r) { return LABEL[r.k] || r.k; }),
    bars("Perangkat terakhir", a.platforms.map(function (r) { return { n: r.n, k: r.k }; }), function (r) { return r.k; })));
}
function loadJobs() {
  return Promise.all([call("/api/admin/jobs?status=" + S.jobSt).then(function (j) { S.jobs = j.jobs; }), call("/api/admin/jobs/sources").then(function (j) { S.srcs = j.sources; })]);
}
function jobRow(j) {
  var pub = el("button", { class: "ok" }, "Terbitkan"), rej = el("button", { class: "ghost" }, "Tolak"), hide = el("button", { class: "ghost" }, "Sembunyikan");
  function decide(st, b) { b.disabled = true; call("/api/admin/jobs/decide", "POST", { id: j.id, status: st }).then(function () { flash("Lowongan diperbarui.", true); return loadJobs(); }).then(draw).catch(function (e) { b.disabled = false; flash(e.msg); }); }
  pub.addEventListener("click", function () { decide("published", pub); });
  rej.addEventListener("click", function () { decide("rejected", rej); });
  hide.addEventListener("click", function () { decide("hidden", hide); });
  return el("div", { class: "item" }, el("div", { class: "name" }, j.title), el("div", { class: "mail" }, [j.company, j.prefecture, j.field, j.visa, j.salary].filter(Boolean).join(" · ")),
    el("div", { class: "meta" }, el("span", { class: "badge" }, j.source), j.by ? "dikirim " + j.by + " · " : "", fmtTime(j.ts), j.reports ? " · " + j.reports + " laporan" : ""),
    j.contact ? el("div", { class: "act" }, "Kontak: " + j.contact) : null, j.raw ? el("div", { class: "raw" }, j.raw) : null,
    el("div", { class: "row" }, S.jobSt === "published" ? hide : pub, S.jobSt === "pending" ? rej : null));
}
function drawJobs(card) {
  var f = el("select", null, el("option", { value: "pending" }, "Menunggu review"), el("option", { value: "published" }, "Tampil"), el("option", { value: "hidden" }, "Disembunyikan"), el("option", { value: "rejected" }, "Ditolak"));
  f.value = S.jobSt; f.addEventListener("change", function () { S.jobSt = f.value; loadJobs().then(draw).catch(function (e) { flash(e.msg); }); });
  card.append(el("div", { class: "row" }, f));
  if (!S.jobs.length) card.append(el("div", { class: "empty" }, "Tidak ada lowongan di sini."));
  S.jobs.forEach(function (j) { card.append(jobRow(j)); });
  var name = el("input", { class: "grow", placeholder: "Nama situs" }), url = el("input", { class: "grow", placeholder: "https://…/feed.xml", spellcheck: "false" }),
    kind = el("select", null, el("option", { value: "rss" }, "RSS/Atom"), el("option", { value: "json" }, "JSON Feed")),
    tr = el("label", { style: "display:flex;align-items:center;gap:6px;margin:0" }, el("input", { type: "checkbox", id: "trusted" }), "Langsung tampil (terpercaya)"),
    add = el("button", null, "Simpan sumber"), pull = el("button", { class: "ghost" }, "Tarik sekarang");
  add.addEventListener("click", function () {
    call("/api/admin/jobs/sources", "POST", { name: name.value.trim(), url: url.value.trim(), kind: kind.value, trusted: $("#trusted").checked }).then(function () { flash("Sumber disimpan.", true); return loadJobs(); }).then(draw).catch(function (e) { flash(e.msg); });
  });
  pull.addEventListener("click", function () {
    pull.disabled = true; call("/api/admin/jobs/ingest", "POST", {}).then(function (j) { flash("Ditarik: " + j.added + " baru, " + j.dup + " duplikat, " + j.errors + " error.", !j.errors); return loadJobs(); }).then(draw).catch(function (e) { pull.disabled = false; flash(e.msg); });
  });
  var src = el("div", { class: "card", style: "margin-top:12px" }, el("h3", null, "Sumber feed (ditarik otomatis tiap Senin 03:17 JST)"));
  if (!S.srcs.length) src.append(el("div", { class: "empty" }, "Belum ada sumber feed."));
  S.srcs.forEach(function (x) {
    var del = el("button", { class: "ghost" }, "Hapus");
    del.addEventListener("click", function () { if (confirm("Hapus sumber " + x.name + "?")) call("/api/admin/jobs/sources", "POST", { delete: true, id: x.id }).then(loadJobs).then(draw).catch(function (e) { flash(e.msg); }); });
    src.append(el("div", { class: "item" }, el("div", { class: "name" }, x.name, x.trusted ? " ✓" : ""), el("div", { class: "mail" }, x.url),
      el("div", { class: "act" }, x.last_run ? "Terakhir " + fmtTime(x.last_run) + " · " + (x.last_status || "") : "Belum pernah ditarik"), el("div", { class: "row" }, del)));
  });
  src.append(el("div", { class: "row", style: "margin-top:10px" }, name, url, kind), el("div", { class: "row", style: "margin-top:8px" }, tr, add, pull));
  card.append(src);
}
function loadMat() {
  return call("/api/admin/study?prefix=" + encodeURIComponent(S.matPre)).then(function (j) { S.mat = j.items; });
}
function matRow(m) {
  var view = el("button", { class: "ghost" }, "Lihat"), del = el("button", null, "Hapus");
  view.addEventListener("click", function () {
    call("/api/admin/study/item?key=" + encodeURIComponent(m.key)).then(function (j) { S.matView = { key: m.key, text: JSON.stringify(j.data, null, 2) }; draw(); }).catch(function (e) { flash(e.msg); });
  });
  del.addEventListener("click", function () {
    if (!confirm("Hapus materi ini? Materi akan dibuat ulang oleh AI saat ada pengguna yang membukanya.\n" + m.key)) return;
    del.disabled = true;
    call("/api/admin/study/delete", "POST", { key: m.key }).then(function () { if (S.matView && S.matView.key === m.key) S.matView = null; flash("Materi dihapus.", true); return loadMat(); }).then(draw).catch(function (e) { del.disabled = false; flash(e.msg); });
  });
  var shown = S.matView && S.matView.key === m.key;
  return el("div", { class: "item" }, el("div", { class: "key" }, m.key), el("div", { class: "meta" }, fmtDate(m.created) + " · " + Math.round(m.size / 100) / 10 + " KB"), el("div", { class: "row" }, view, del), shown ? el("pre", { class: "json" }, S.matView.text) : null);
}

var tmr;
function draw() {
  if (!S.key) return drawLogin();
  var app = $("#app"), keep = $("#flash"); app.textContent = ""; if (keep) app.append(keep);
  $("#out").style.display = "";
  var st = S.stats || { total: 0, premium: 0, plus: 0, pending: 0 };
  var tab = function (id, label, onopen) { var b = el("button", { class: S.tab === id ? "on" : "" }, label); b.addEventListener("click", function () { S.tab = id; if (onopen) onopen().then(draw).catch(function (e) { flash(e.msg); }); else draw(); }); return b; };
  app.append(el("div", { class: "tabs", style: "flex-wrap:wrap" }, tab("dash", "Statistik", loadAn), tab("req", "Permintaan (" + S.reqs.length + ")"), tab("usr", "Pengguna (" + st.total + ")"), tab("job", "Lowongan", loadJobs), tab("mat", "Materi", loadMat)));
  if (S.tab === "dash") { drawDash(app); app.append(el("button", { class: "ghost", onclick: refreshAll }, "Segarkan")); return; }
  if (S.tab === "req" || S.tab === "usr") app.append(el("div", { class: "stats" },
    el("div", { class: "stat" }, el("b", null, st.total), el("span", null, "Pengguna")),
    el("div", { class: "stat" }, el("b", null, st.premium), el("span", null, "Premium aktif")),
    el("div", { class: "stat" }, el("b", null, st.plus), el("span", null, "Premium+ aktif")),
    el("div", { class: "stat" }, el("b", null, st.pending), el("span", null, "Menunggu"))));
  var card = el("div", { class: "card" });
  if (S.tab === "job") drawJobs(card);
  else if (S.tab === "req") {
    if (!S.reqs.length) card.append(el("div", { class: "empty" }, "Belum ada permintaan upgrade."));
    S.reqs.forEach(function (r) { card.append(reqRow(r)); });
  } else if (S.tab === "mat") {
    var pre = el("input", { class: "grow", placeholder: "Awalan kunci, mis. content|g_te_iru atau quiz|", value: S.matPre, autocomplete: "off", spellcheck: "false" });
    var find = el("button", null, "Cari"), delAll = el("button", { class: "ghost" }, "Hapus semua yang cocok");
    find.addEventListener("click", function () { S.matPre = pre.value.trim(); S.matView = null; loadMat().then(draw).catch(function (e) { flash(e.msg); }); });
    pre.addEventListener("keydown", function (e) { if (e.key === "Enter") find.click(); });
    delAll.addEventListener("click", function () {
      var p = pre.value.trim();
      if (p.length < 6) return flash("Awalan minimal 6 karakter supaya tidak menghapus terlalu banyak.");
      if (!confirm("Hapus SEMUA materi berawalan \"" + p + "\" (" + S.mat.length + " tampil)? Materi dibuat ulang oleh AI saat dibuka pengguna.")) return;
      call("/api/admin/study/delete", "POST", { prefix: p }).then(function (j) { S.matPre = p; S.matView = null; flash(j.deleted + " materi dihapus.", true); return loadMat(); }).then(draw).catch(function (e) { flash(e.msg); });
    });
    card.append(el("div", { class: "row" }, pre, find, delAll),
      el("div", { class: "meta", style: "margin-top:8px" }, "Format kunci: jenis|topik|bahasa|set. Jenis: content atau quiz. Contoh: content|g_te_iru|id|0"));
    if (!S.mat.length) card.append(el("div", { class: "empty" }, "Belum ada materi tersimpan (atau tidak ada yang cocok)."));
    S.mat.forEach(function (m) { card.append(matRow(m)); });
  } else {
    var q = el("input", { class: "grow", placeholder: "Cari nama atau email", value: S.q }), f = el("select", null,
      el("option", { value: "all" }, "Semua"), el("option", { value: "premium" }, "Premium"), el("option", { value: "plus" }, "Premium+"),
      el("option", { value: "expiring" }, "Segera habis (7 hari)"), el("option", { value: "pending" }, "Menunggu persetujuan"), el("option", { value: "free" }, "Gratis"),
      el("option", { value: "active7" }, "Aktif 7 hari terakhir"), el("option", { value: "dormant30" }, "Tidak aktif > 30 hari"));
    f.value = S.f;
    var so = el("select", null, el("option", { value: "created" }, "Urut: terbaru daftar"), el("option", { value: "active" }, "Urut: terakhir aktif"));
    so.value = S.sort; so.addEventListener("change", function () { S.sort = so.value; loadUsers(false).then(draw).catch(function (e) { flash(e.msg); }); });
    q.addEventListener("input", function () { clearTimeout(tmr); tmr = setTimeout(function () { S.q = q.value.trim(); loadUsers(false).then(function () { draw(); var n = $(".grow"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }).catch(function (e) { flash(e.msg); }); }, 350); });
    f.addEventListener("change", function () { S.f = f.value; loadUsers(false).then(draw).catch(function (e) { flash(e.msg); }); });
    card.append(el("div", { class: "row" }, q, f, so));
    if (!S.users.length) card.append(el("div", { class: "empty" }, "Tidak ada pengguna."));
    S.users.forEach(function (u) { card.append(userRow(u)); });
    if (S.more) { var m = el("button", { class: "ghost", style: "margin-top:10px" }, "Muat lagi"); m.addEventListener("click", function () { S.off += 50; loadUsers(true).then(draw).catch(function (e) { flash(e.msg); }); }); card.append(m); }
  }
  app.append(card);
  app.append(el("button", { class: "ghost", onclick: refreshAll }, "Segarkan"));
}

$("#out").addEventListener("click", logout);
if (S.key) refreshAll(); else drawLogin();
</script>
</body>
</html>
